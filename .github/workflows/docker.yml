name: Create and publish a Docker image to hub.docker.com

on:
  push:
    branches:
      - main
    paths:
      - '03_App/**'
      - 'renv.lock'

jobs:
  build:
    if: github.repository == 'RegenImm-Lab/SciLifeLabServe_limb_data'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set date and time as tag
        run: echo "TAG=$(TZ='Europe/Stockholm' date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/limb-shiny-app:$TAG -f Dockerfile .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag as latest
        run: docker tag ${{ secrets.DOCKERHUB_USERNAME }}/limb-shiny-app:$TAG ${{ secrets.DOCKERHUB_USERNAME }}/scilifelabServe_limb_data:latest

      - name: Push timestamp tag
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/limb-shiny-app:$TAG

      - name: Push latest
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/limb-shiny-app:latest
